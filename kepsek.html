<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Kepala Sekolah - E-Arsip</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header" style="justify-content: center; padding: 24px 12px;">
        <img src="assets/img/logo-zefiz.png" alt="Zefiz Logo" style="width: 80px; height: auto; border-radius: 8px;">
      </div>
      <div class="sidebar-menu">
        <button class="menu-item active" onclick="showSection('dashboard')">
          <i class="ri-dashboard-line"></i> Monitoring Surat
        </button>
        <button class="menu-item" onclick="showSection('persetujuan')">
          <i class="ri-checkbox-circle-line"></i> Persetujuan Surat
        </button>
        <button class="menu-item" onclick="showSection('arsip')">
          <i class="ri-archive-line"></i> Semua Arsip
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <!-- TOPBAR -->
      <header class="topbar">
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="btn-menu-toggle" onclick="toggleSidebar()">
            <i class="ri-menu-line"></i>
          </button>
          <div class="user-info">
            <h3 id="welcomeText">Selamat Datang Kepala Sekolah</h3>
            <p><span id="namaUser"></span> • <span id="roleUser">Kepala Sekolah</span> • <span id="sekolahUser"></span></p>
          </div>
        </div>
        <button class="btn-logout" onclick="logout()">
          <i class="ri-logout-box-line"></i> Logout
        </button>
      </header>

      <!-- SECTION: DASHBOARD -->
      <section id="dashboard" class="section">
        <div class="section-title">
          <h2>Dashboard</h2>
        </div>
        <div class="stats-grid">
          <div class="stat-card" style="background: linear-gradient(135deg, #f59e0b, #fbbf24);">
            <h3>Menunggu Persetujuan</h3>
            <div class="value" id="statPending">0</div>
          </div>
          <div class="stat-card" style="background: linear-gradient(135deg, #10b981, #34d399);">
            <h3>Surat Disetujui (Bulan ini)</h3>
            <div class="value" id="statDisetujui">0</div>
          </div>
        </div>
      </section>

      <!-- SECTION: PERSETUJUAN SURAT -->
      <section id="persetujuan" class="section hidden">
        <div class="section-title">
          <h2>Persetujuan Surat</h2>
        </div>
        <div class="card">
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Nomor Surat</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="dataKepsek">
                <!-- JS akan inject kesini -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- SECTION: ARSIP SURAT -->
      <section id="arsip" class="section hidden">
        <div class="section-title">
          <h2>Arsip Keseluruhan</h2>
        </div>
        <div class="card">
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Nomor Surat</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="arsipList">
                <!-- JS akan inject kesini -->
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/kepsek.js?v=2"></script>
  <script>
    function showSection(id) {
      document.querySelectorAll('.section').forEach(sec => sec.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      
      document.querySelectorAll('.menu-item').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');

      if (window.innerWidth <= 768) {
        document.querySelector('.sidebar').classList.remove('open');
      }
    }

    function toggleSidebar() {
      document.querySelector('.sidebar').classList.toggle('open');
    }

    function logout() {
      localStorage.removeItem("activeUser");
      location.href = "login.html";
    }
  </script>
</body>
</html>
