<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - E-Arsip</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <img src="assets/img/logo-zefiz.png" alt="Zefiz Logo" style="width: 64px; height: auto; border-radius: 12px; margin-bottom: 20px;">
      <h2>E-Arsip Login</h2>
      <p>Silakan masuk ke akun Anda</p>
      
      <div class="form-group">
        <input type="email" id="loginEmail" placeholder="Email" />
      </div>
      <div class="form-group">
        <input type="password" id="loginPass" placeholder="Password" />
      </div>

      <button class="btn-primary" onclick="login()">Masuk</button>
      
      <div class="auth-links">
        <p>Belum punya akun? <a href="registrasi.html">Daftar di sini</a></p>
      </div>
    </div>
    <div style="margin-top: 24px; color: rgba(255, 255, 255, 0.9); font-size: 0.85rem; font-weight: 500;">
      &copy; 2026 Zefiz
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/login.js"></script>
</body>
</html>
